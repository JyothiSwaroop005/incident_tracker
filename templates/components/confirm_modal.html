{% macro confirm_delete_modal(modal_id, incident_id, incident_title, delete_form) -%}
<div class="modal fade" id="{{ modal_id }}" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content confirm-modal">
      <div class="modal-body text-center">
        <div class="confirm-icon"><i class="bi bi-trash3-fill"></i></div>
        <h5>Delete this incident?</h5>
        <p class="text-dim">"{{ incident_title }}" will be permanently removed. This can't be undone.</p>
        <form method="post" action="{{ url_for('incidents.delete_incident', incident_id=incident_id) }}" class="d-flex gap-2 justify-content-center mt-3">
          {{ delete_form.hidden_tag() }}
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-danger">Delete Incident</button>
        </form>
      </div>
    </div>
  </div>
</div>
{%- endmacro %}
